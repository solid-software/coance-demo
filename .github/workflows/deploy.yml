name: Deploy

on:
  push:
    branches: [main]

# The deploy job needs to read the code and request an identity token for
# the cloud provider; nothing else.
permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Cloud Run
        run: ./scripts/deploy.sh
