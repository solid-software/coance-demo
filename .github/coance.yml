# .github/coance.yml (coance-demo: "Acme Health", telehealth with card payments)
# Levels are named by what the code is, strictest first. Related standards
# are context in each description, not a claim about the code.
levels:
  payments:
    approvals: 2
    self_review: false
    description: |
      ### 💳 Payments
      Money moves here. Read every changed line; two reviewers, neither the
      author. Check the tests cover declined, partial and repeated payments.

      **Related:** PCI DSS v4.0.1 requirement 6.2.3.1 (custom code reviewed
      by someone other than its author before release)
      **Docs:** [Payments review checklist](https://github.com/solid-software/coance-demo/blob/main/docs/review/payments.md) ·
      [Card data flow](https://github.com/solid-software/coance-demo/blob/main/docs/architecture/card-data-flow.md)
  auth:
    approvals: 2
    self_review: false
    description: |
      ### 🔐 Auth
      Login, sessions, permissions and tokens. Read every changed line; one
      reviewer from security.

      **Related:** OWASP ASVS 5.0 (authentication, session management,
      authorization)
      **Docs:** [Auth review checklist](https://github.com/solid-software/coance-demo/blob/main/docs/review/auth.md)
  personal-data:
    approvals: 1
    self_review: false
    description: |
      ### 🩺 Personal data
      Reads, stores or exports patient data. The owner reads every changed
      line: every access is logged, scoped to the patient's care team, and
      nothing leaks into logs.

      **Related:** GDPR Articles 25 and 32; HIPAA 45 CFR 164.312 for health data
      **Docs:** [PHI handling guide](https://github.com/solid-software/coance-demo/blob/main/docs/review/phi.md)
  infrastructure:
    approvals: 1
    self_review: false
    description: |
      ### 🏗️ Infrastructure
      CI, deploy and infrastructure as code. The owner reads every changed
      line and the plan output.

      **Related:** NIST SSDF PW.7 (review code); SOC 2 CC8.1 (change management)
      **Docs:** [Infrastructure change runbook](https://github.com/solid-software/coance-demo/blob/main/docs/runbooks/infra-change.md)
  migrations:
    approvals: 1
    self_review: false
    description: |
      ### 🗄️ Migrations
      Database schema and data changes, hard to undo. The owner reads every
      changed line, including the rollback.

      **Related:** SOC 2 CC8.1 (change management)
  standard:
    description: |
      ### Standard
      Read the file. Does the change make sense?

template: |
  {description}

  **Approvals:** {approvals} needed · **Who can approve:** {owners}
  Resolve this thread or reply `/approve` once you're done.

  <details><summary>Why this file is governed</summary>

  `{file}` matched {reason} (level `{level}`). {lines} lines changed.
  </details>

rules:
  payments:
    any:
      paths:
        /lib/payments/: "@solid-software/payments"
      keywords:
        stripe: "@solid-software/payments"
  auth:
    paths:
      /lib/auth/: "@solid-software/security"
  personal-data:
    paths:
      /lib/records/: "@solid-software/clinical"
  infrastructure:
    paths:
      /infra/: "@solid-software/platform"
      /.github/: "@solid-software/platform"
  migrations:
    paths:
      /db/migrations/: "@solid-software/platform"
  standard:
    paths: ["*.dart"]
